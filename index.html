<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cafe Atlas 100 - Linked</title>
    <!-- 구글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="brand" onclick="go('map')">Cafe Atlas 100</div>
    </header>

    <!-- 지도 페이지 -->
    <section id="p-map" class="page active">
        <div class="wrap">
            <div class="mapContainer">
                <div class="region-tag" style="left: 45%; top: 32%;"><button class="regionBtn"
                        onclick="showList('서울')">서울</button></div>
                <div class="region-tag" style="left: 42%; top: 42%;"><button class="regionBtn"
                        onclick="showList('경기/인천')">경기/인천</button></div>
                <div class="region-tag" style="left: 70%; top: 30%;"><button class="regionBtn"
                        onclick="showList('강원')">강원</button></div>
                <div class="region-tag" style="left: 75%; top: 65%;"><button class="regionBtn"
                        onclick="showList('경상')">경상</button></div>
                <div class="region-tag" style="left: 35%; top: 68%;"><button class="regionBtn"
                        onclick="showList('충청/전라')">충청/전라</button></div>
                <div class="region-tag" style="left: 30%; top: 88%;"><button class="regionBtn"
                        onclick="showList('제주')">제주</button></div>
            </div>
        </div>
    </section>

    <!-- 리스트 페이지 -->
    <section id="p-list" class="page">
        <div class="wrap">
            <button onclick="go('map')" style="margin-bottom:20px; padding:8px 15px; cursor:pointer;">← 지도보기</button>
            <h2 id="listTitle"></h2>
            <div class="grid" id="grid"></div>
        </div>
    </section>

    <!-- 외부 자바스크립트 연결 -->
    <script src="js/script.js"></script>
</body>

</html>
